name: Export Traffic with Daily Summary and Email

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  export-traffic:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout traffic data repository
      uses: actions/checkout@v3
      with:
        repository: paulrekaris/TGA-Audit-Traffic-Data
        token: ${{ secrets.TRAFFIC_TOKEN }}
        path: traffic-repo
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install requests pandas
    
    - name: Set date variable
      run: echo "DATE_STR=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
    
    - name: Export traffic data
      working-directory: traffic-repo
      env:
        TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
      run: |
        cat > export.py << 'EXPORT_SCRIPT'
        import requests
        import json
        import os
        import pandas as pd
        from datetime import datetime, timezone, timedelta
        from zoneinfo import ZoneInfo
        import re

        GITHUB_TOKEN = os.environ['TRAFFIC_TOKEN']
        REPO_OWNER = 'paulrekaris'
        REPO_NAME = 'TGA-COVID19-Vaccine-Safety-Monitoring-Audit'
        BASE_URL = f'https://api.github.com/repos/{REPO_OWNER}/{REPO_NAME}'

        headers = {
            'Authorization': f'token {GITHUB_TOKEN}',
            'Accept': 'application/vnd.github.v3+json'
        }

        INSTITUTIONAL_DOMAINS = {
            'Australian Government': [
                r'\.gov\.au$',
                r'parliament\.vic\.gov\.au',
                r'parliament\.nsw\.gov\.au',
                r'parliament\.qld\.gov\.au',
                r'parliament\.wa\.gov\.au',
                r'parliament\.sa\.gov\.au',
                r'parliament\.tas\.gov\.au',
                r'parliament\.nt\.gov\.au',
                r'parliament\.act\.gov\.au'
            ],
            'Oversight Bodies': [
                r'aph\.gov\.au',
                r'anao\.gov\.au',
                r'oaic\.gov\.au',
                r'ombudsman\.',
                r'humanrights\.gov\.au',
                r'\.audit\.',
                r'integrity\.'
            ],
            'US Government': [
                r'\.gov$'
            ],
            'Academic': [
                r'\.edu\.au$',
                r'\.ac\.uk$',
                r'\.edu$',
                r'\.ac\.nz$',
                r'\.university\.',
                r'\.uni\.',
                r'\.edu\.sg$',
                r'nla\.gov\.au',
                r'zenodo\.org',
                r'grattan\.edu\.au',
                r'mendeley\.com',
                r'ssrn\.com',
                r'osf\.io',
                r'socopen\.org',
                r'elsevier\.com'
            ],
            'NGO/Advocacy': [
                r'\.org\.au$',
                r'\.org\.nz$'
            ],
            'Consulting': [
                r'deloitte\.',
                r'pwc\.',
                r'kpmg\.',
                r'ey\.com',
                r'mckinsey\.',
                r'bain\.',
                r'bcg\.com',
                r'accenture\.'
            ],
            'Legal': [
                r'\.law$',
                r'law\.',
                r'legal\.',
                r'lawfirm\.',
                r'lawyers\.',
                r'barristers\.',
                r'solicitors\.'
            ],
            'Major Media': [
                r'abc\.net\.au',
                r'theguardian\.com',
                r'smh\.com\.au',
                r'theage\.com\.au',
                r'news\.com\.au',
                r'reuters\.com',
                r'afr\.com',
                r'crikey\.com\.au',
                r'theconversation\.com',
                r'bbc\.co\.uk',
                r'nytimes\.com',
                r'washingtonpost\.com'
            ],
            'Health/Medical': [
                r'tga\.gov\.au',
                r'health\.gov\.au',
                r'who\.int',
                r'nih\.gov',
                r'bma\.org',
                r'ama\.com\.au',
                r'racgp\.org\.au',
                r'pharma\.',
                r'pharmaceutical\.'
            ],
            'Corporate': [
                r'\.com\.au$',
                r'corporate\.',
                r'\.co\.nz$'
            ]
        }

        def categorize_referrer(referrer):
            if not referrer or referrer == 'github.com':
                return None
            referrer_lower = referrer.lower()
            for category, patterns in INSTITUTIONAL_DOMAINS.items():
                for pattern in patterns:
                    if re.search(pattern, referrer_lower):
                        return category
            return 'Other'

        now = datetime.now(timezone.utc)
        date_str = now.strftime('%Y-%m-%d')

        # Calculate AEST/AEDT time and data-through date
        aest_tz = ZoneInfo('Australia/Melbourne')
        now_aest = now.astimezone(aest_tz)
        aest_label = now_aest.strftime('%Z')
        aest_time_str = now_aest.strftime('%-I:%M %p') + f' {aest_label}'
        yesterday_utc = now - timedelta(days=1)
        data_through_str = yesterday_utc.strftime('%A, %d %B %Y')

        print("Fetching traffic data...")
        
        try:
            clones_response = requests.get(f'{BASE_URL}/traffic/clones', headers=headers)
            clones_response.raise_for_status()
            views_response = requests.get(f'{BASE_URL}/traffic/views', headers=headers)
            views_response.raise_for_status()
            referrers_response = requests.get(f'{BASE_URL}/traffic/popular/referrers', headers=headers)
            referrers_response.raise_for_status()
            paths_response = requests.get(f'{BASE_URL}/traffic/popular/paths', headers=headers)
            paths_response.raise_for_status()
            repo_response = requests.get(BASE_URL, headers=headers)
            repo_response.raise_for_status()
        except requests.exceptions.RequestException as e:
            print(f"API request failed: {e}")
            exit(1)

        clones_data = clones_response.json()
        views_data = views_response.json()
        referrers_data = referrers_response.json()
        paths_data = paths_response.json()
        repo_data = repo_response.json()

        stars_count = repo_data.get('stargazers_count', 0)
        forks_count = repo_data.get('forks_count', 0)
        watchers_count = repo_data.get('subscribers_count', 0)

        try:
            clones_df = pd.read_csv('clones.csv')
            views_df = pd.read_csv('views.csv')
            engagement_df = pd.read_csv('engagement.csv')
        except (FileNotFoundError, pd.errors.EmptyDataError):
            clones_df = pd.DataFrame(columns=['date', 'daily_clones', 'daily_unique_cloners'])
            views_df = pd.DataFrame(columns=['date', 'daily_views', 'daily_unique_visitors'])
            engagement_df = pd.DataFrame(columns=['date', 'stars', 'forks', 'watchers'])

        # Get 14-day window totals (for reference and reporting)
        window_14day_clones = clones_data.get('count', 0)
        window_14day_unique_cloners = clones_data.get('uniques', 0)
        window_14day_views = views_data.get('count', 0)
        window_14day_unique_visitors = views_data.get('uniques', 0)

        if date_str in clones_df['date'].values:
            print(f"Data for {date_str} already exists. Exiting.")
            exit(0)

        # Extract YESTERDAY'S single day counts (not 14-day window)
        yesterday_clones = 0
        yesterday_unique_cloners = 0
        yesterday_views = 0
        yesterday_unique_visitors = 0

        if 'clones' in clones_data and len(clones_data['clones']) >= 2:
            yesterday_day = clones_data['clones'][-2]
            yesterday_clones = yesterday_day.get('count', 0)
            yesterday_unique_cloners = yesterday_day.get('uniques', 0)

        if 'views' in views_data and len(views_data['views']) >= 2:
            yesterday_day = views_data['views'][-2]
            yesterday_views = yesterday_day.get('count', 0)
            yesterday_unique_visitors = yesterday_day.get('uniques', 0)

        # Capture previous peaks BEFORE appending today's row
        prev_peak_clones = int(clones_df['daily_clones'].max()) if len(clones_df) > 0 else 0
        prev_peak_views = int(views_df['daily_views'].max()) if len(views_df) > 0 else 0
        prev_peak_unique_cloners = int(clones_df['daily_unique_cloners'].max()) if len(clones_df) > 0 else 0
        prev_peak_unique_views = int(views_df['daily_unique_visitors'].max()) if len(views_df) > 0 else 0

        # Capture previous totals for milestone detection
        prev_total_clones = clones_df['daily_clones'].sum() if len(clones_df) > 0 else 0
        prev_total_views = views_df['daily_views'].sum() if len(views_df) > 0 else 0

        prev_stars = engagement_df['stars'].iloc[-1] if len(engagement_df) > 0 else 0
        prev_forks = engagement_df['forks'].iloc[-1] if len(engagement_df) > 0 else 0
        prev_watchers = engagement_df['watchers'].iloc[-1] if len(engagement_df) > 0 else 0

        new_stars = stars_count - prev_stars
        new_forks = forks_count - prev_forks
        new_watchers = watchers_count - prev_watchers

        # Save DAILY counts (not 14-day windows)
        new_clones_row = pd.DataFrame([{
            'date': date_str,
            'daily_clones': yesterday_clones,
            'daily_unique_cloners': yesterday_unique_cloners
        }])
        new_views_row = pd.DataFrame([{
            'date': date_str,
            'daily_views': yesterday_views,
            'daily_unique_visitors': yesterday_unique_visitors
        }])
        new_engagement_row = pd.DataFrame([{
            'date': date_str,
            'stars': stars_count,
            'forks': forks_count,
            'watchers': watchers_count
        }])

        clones_df = pd.concat([clones_df, new_clones_row], ignore_index=True)
        views_df = pd.concat([views_df, new_views_row], ignore_index=True)
        engagement_df = pd.concat([engagement_df, new_engagement_row], ignore_index=True)

        clones_df.to_csv('clones.csv', index=False)
        views_df.to_csv('views.csv', index=False)
        engagement_df.to_csv('engagement.csv', index=False)

        # Calculate 7-day and 14-day AVERAGES from daily counts
        if len(clones_df) >= 7:
            avg_7day_clones = clones_df.tail(7)['daily_clones'].mean()
            avg_7day_unique_cloners = clones_df.tail(7)['daily_unique_cloners'].mean()
        else:
            avg_7day_clones = clones_df['daily_clones'].mean() if len(clones_df) > 0 else 0
            avg_7day_unique_cloners = clones_df['daily_unique_cloners'].mean() if len(clones_df) > 0 else 0

        if len(clones_df) >= 14:
            avg_14day_clones = clones_df.tail(14)['daily_clones'].mean()
            avg_14day_unique_cloners = clones_df.tail(14)['daily_unique_cloners'].mean()
        else:
            avg_14day_clones = clones_df['daily_clones'].mean() if len(clones_df) > 0 else 0
            avg_14day_unique_cloners = clones_df['daily_unique_cloners'].mean() if len(clones_df) > 0 else 0

        if len(views_df) >= 7:
            avg_7day_views = views_df.tail(7)['daily_views'].mean()
            avg_7day_unique_visitors = views_df.tail(7)['daily_unique_visitors'].mean()
        else:
            avg_7day_views = views_df['daily_views'].mean() if len(views_df) > 0 else 0
            avg_7day_unique_visitors = views_df['daily_unique_visitors'].mean() if len(views_df) > 0 else 0

        if len(views_df) >= 14:
            avg_14day_views = views_df.tail(14)['daily_views'].mean()
            avg_14day_unique_visitors = views_df.tail(14)['daily_unique_visitors'].mean()
        else:
            avg_14day_views = views_df['daily_views'].mean() if len(views_df) > 0 else 0
            avg_14day_unique_visitors = views_df['daily_unique_visitors'].mean() if len(views_df) > 0 else 0

        # Calculate accurate all-time totals from DAILY counts
        days_tracked = len(clones_df)
        total_clones_alltime = clones_df['daily_clones'].sum() if len(clones_df) > 0 else 0
        total_unique_cloners_alltime = clones_df['daily_unique_cloners'].sum() if len(clones_df) > 0 else 0
        avg_daily_clones = total_clones_alltime / days_tracked if days_tracked > 0 else 0
        avg_daily_unique_cloners = total_unique_cloners_alltime / days_tracked if days_tracked > 0 else 0
        total_views_alltime = views_df['daily_views'].sum() if len(views_df) > 0 else 0
        total_unique_views_alltime = views_df['daily_unique_visitors'].sum() if len(views_df) > 0 else 0
        avg_daily_views_alltime = total_views_alltime / days_tracked if days_tracked > 0 else 0
        avg_daily_unique_views = total_unique_views_alltime / days_tracked if days_tracked > 0 else 0

        # Peak day calculations
        if len(clones_df) > 0:
            peak_clones_idx = clones_df['daily_clones'].idxmax()
            peak_clones_count = int(clones_df.loc[peak_clones_idx, 'daily_clones'])
            peak_clones_date = clones_df.loc[peak_clones_idx, 'date']
            peak_unique_clones_idx = clones_df['daily_unique_cloners'].idxmax()
            peak_unique_clones_count = int(clones_df.loc[peak_unique_clones_idx, 'daily_unique_cloners'])
            peak_unique_clones_date = clones_df.loc[peak_unique_clones_idx, 'date']
        else:
            peak_clones_count = 0
            peak_clones_date = 'N/A'
            peak_unique_clones_count = 0
            peak_unique_clones_date = 'N/A'

        if len(views_df) > 0:
            peak_views_idx = views_df['daily_views'].idxmax()
            peak_views_count = int(views_df.loc[peak_views_idx, 'daily_views'])
            peak_views_date = views_df.loc[peak_views_idx, 'date']
            peak_unique_views_idx = views_df['daily_unique_visitors'].idxmax()
            peak_unique_views_count = int(views_df.loc[peak_unique_views_idx, 'daily_unique_visitors'])
            peak_unique_views_date = views_df.loc[peak_unique_views_idx, 'date']
        else:
            peak_views_count = 0
            peak_views_date = 'N/A'
            peak_unique_views_count = 0
            peak_unique_views_date = 'N/A'

        institutional_referrers = {}
        
        if referrers_data and len(referrers_data) > 0:
            for ref in referrers_data:
                category = categorize_referrer(ref['referrer'])
                if category and category != 'Other':
                    if category not in institutional_referrers:
                        institutional_referrers[category] = []
                    institutional_referrers[category].append({
                        'referrer': ref['referrer'],
                        'count': ref['count']
                    })

        institutional_text = ""
        if institutional_referrers:
            institutional_text = "INSTITUTIONAL TRAFFIC DETECTED\n"
            for category, refs in institutional_referrers.items():
                institutional_text += f"\n   {category}:\n"
                for ref in refs:
                    institutional_text += f"      - {ref['referrer']} ({ref['count']} views)\n"
            institutional_text += "\n"
        else:
            institutional_text = "INSTITUTIONAL TRAFFIC\n   No institutional domains detected in past 14 days\n\n"

        referrers_text = ""
        if referrers_data and len(referrers_data) > 0:
            for i, ref in enumerate(referrers_data[:6], 1):
                referrers_text += f"   {i}. {ref['referrer']} ({ref['count']} views)\n"
        else:
            referrers_text = "   No external referrers in past 14 days\n"

        paths_text = ""
        if paths_data and len(paths_data) > 0:
            for i, path in enumerate(paths_data[:4], 1):
                path_title = path['path'] if path['path'] != '/' else 'Main page'
                paths_text += f"   {i}. {path_title} ({path['count']} views)\n"
        else:
            paths_text = "   No path data available\n"

        # --- Build smart commentary (rare events only) ---
        commentary = []

        # Institutional attention
        if institutional_referrers:
            categories = ', '.join(institutional_referrers.keys())
            commentary.append(f"INSTITUTIONAL ATTENTION: {categories}")

        # New engagement
        if new_stars > 0 or new_forks > 0:
            commentary.append("ENGAGEMENT ALERT: New stars/forks detected")

        # New peak alerts
        if yesterday_clones > prev_peak_clones and prev_peak_clones > 0:
            commentary.append(f"NEW PEAK: All-time clone record ({yesterday_clones:,} clones, prev: {prev_peak_clones:,})")
        if yesterday_views > prev_peak_views and prev_peak_views > 0:
            commentary.append(f"NEW PEAK: All-time view record ({yesterday_views:,} views, prev: {prev_peak_views:,})")
        if yesterday_unique_cloners > prev_peak_unique_cloners and prev_peak_unique_cloners > 0:
            commentary.append(f"NEW PEAK: All-time unique cloners record ({yesterday_unique_cloners:,} unique)")
        if yesterday_unique_visitors > prev_peak_unique_views and prev_peak_unique_views > 0:
            commentary.append(f"NEW PEAK: All-time unique views record ({yesterday_unique_visitors:,} unique)")

        # Milestone alerts
        milestones = [1000, 2500, 5000, 7500, 10000, 25000, 50000, 100000]
        for m in milestones:
            if total_clones_alltime >= m and prev_total_clones < m:
                commentary.append(f"MILESTONE: Passed {m:,} total clones")
            if total_views_alltime >= m and prev_total_views < m:
                commentary.append(f"MILESTONE: Passed {m:,} total views")

        # Day milestones
        day_milestones = [50, 100, 150, 200, 365]
        for m in day_milestones:
            if days_tracked == m:
                commentary.append(f"MILESTONE: {m} days of tracking")

        # Fallback
        if not commentary:
            commentary.append("No notable events")

        commentary_text = "\n   ".join(commentary)

        sep = "----------------------------------------------------------------------"
        
        summary_parts = []
        summary_parts.append(sep)
        summary_parts.append("TGA AUDIT TRAFFIC SUMMARY")
        summary_parts.append(now.strftime('%A, %d %B %Y'))
        summary_parts.append(f"Report generated: {aest_time_str} | Data through: {data_through_str}")
        summary_parts.append(sep)
        summary_parts.append("")
        summary_parts.append("YESTERDAY'S ACTIVITY")
        summary_parts.append(f"   {yesterday_clones} clones ({yesterday_unique_cloners} unique)")
        summary_parts.append(f"   {yesterday_views} views ({yesterday_unique_visitors} unique visitors)")
        summary_parts.append("")
        summary_parts.append("CLONE TRENDS (from daily counts)")
        summary_parts.append(f"   7-day average: {avg_7day_clones:.1f} clones/day ({avg_7day_unique_cloners:.1f} unique)")
        summary_parts.append(f"   14-day average: {avg_14day_clones:.1f} clones/day ({avg_14day_unique_cloners:.1f} unique)")
        summary_parts.append("")
        summary_parts.append("VIEW TRENDS (from daily counts)")
        summary_parts.append(f"   7-day average: {avg_7day_views:.1f} views/day ({avg_7day_unique_visitors:.1f} unique)")
        summary_parts.append(f"   14-day average: {avg_14day_views:.1f} views/day ({avg_14day_unique_visitors:.1f} unique)")
        summary_parts.append("")
        summary_parts.append("KEY OBSERVATIONS")
        summary_parts.append(f"   {commentary_text}")
        summary_parts.append("")
        summary_parts.append(institutional_text.rstrip())
        summary_parts.append("")
        summary_parts.append("ALL TRAFFIC SOURCES (Top 6)")
        summary_parts.append(referrers_text.rstrip())
        summary_parts.append("")
        summary_parts.append("MOST VIEWED CONTENT")
        summary_parts.append(paths_text.rstrip())
        summary_parts.append(sep)
        summary_parts.append("")
        summary_parts.append("14-DAY WINDOW (GitHub's rolling window)")
        summary_parts.append(f"   Total clones: {window_14day_clones:,} | Unique: {window_14day_unique_cloners}")
        summary_parts.append(f"   Total views: {window_14day_views:,} | Unique: {window_14day_unique_visitors}")
        summary_parts.append("   Note: This is GitHub's 14-day rolling window total")
        summary_parts.append("")
        summary_parts.append("Repository Engagement")
        summary_parts.append(f"   Stars: {stars_count} | Forks: {forks_count} | Watchers: {watchers_count}")
        summary_parts.append("")
        summary_parts.append("All-Time Stats (from daily tracking)")
        summary_parts.append(f"   Days tracked: {days_tracked}")
        summary_parts.append("")
        summary_parts.append(f"   Total clones recorded: {total_clones_alltime:,.0f}")
        summary_parts.append(f"   Total unique cloners recorded: {total_unique_cloners_alltime:,.0f}")
        summary_parts.append(f"   Average daily clones: {avg_daily_clones:.1f}")
        summary_parts.append(f"   Average daily unique cloners: {avg_daily_unique_cloners:.1f}")
        summary_parts.append("")
        summary_parts.append(f"   Total views recorded: {total_views_alltime:,.0f}")
        summary_parts.append(f"   Total unique views recorded: {total_unique_views_alltime:,.0f}")
        summary_parts.append(f"   Average daily views: {avg_daily_views_alltime:.1f}")
        summary_parts.append(f"   Average daily unique views: {avg_daily_unique_views:.1f}")
        summary_parts.append("")
        summary_parts.append(f"   Peak clone day: {peak_clones_date} ({peak_clones_count:,} clones)")
        summary_parts.append(f"   Peak unique cloners day: {peak_unique_clones_date} ({peak_unique_clones_count:,} unique)")
        summary_parts.append(f"   Peak view day: {peak_views_date} ({peak_views_count:,} views)")
        summary_parts.append(f"   Peak unique views day: {peak_unique_views_date} ({peak_unique_views_count:,} unique)")
        summary_parts.append("")
        summary_parts.append(f"   Note: Calculated from actual daily counts, not rolling windows")
        summary_parts.append("")
        summary_parts.append(sep)
        summary_parts.append("Manual checks:")
        summary_parts.append(f"Referring sites: https://github.com/{REPO_OWNER}/{REPO_NAME}/graphs/traffic")
        summary_parts.append("Full data: https://github.com/paulrekaris/TGA-Audit-Traffic-Data")
        
        summary = "\n".join(summary_parts)

        with open('LATEST_SUMMARY.txt', 'w') as f:
            f.write(summary)

        os.makedirs('daily-summaries', exist_ok=True)
        with open(f'daily-summaries/summary_{date_str}.txt', 'w') as f:
            f.write(summary)

        if institutional_referrers:
            os.makedirs('institutional-logs', exist_ok=True)
            with open(f'institutional-logs/institutional_{date_str}.json', 'w') as f:
                json.dump(institutional_referrers, f, indent=2)

        os.makedirs('json-backups', exist_ok=True)
        with open(f'json-backups/clones_{date_str}.json', 'w') as f:
            json.dump(clones_data, f, indent=2)
        with open(f'json-backups/views_{date_str}.json', 'w') as f:
            json.dump(views_data, f, indent=2)
        with open(f'json-backups/referrers_{date_str}.json', 'w') as f:
            json.dump(referrers_data, f, indent=2)

        print("Traffic data exported successfully!")
        print(summary)
        EXPORT_SCRIPT
        python export.py
    
    - name: Commit and push changes
      working-directory: traffic-repo
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git add .
        git commit -m "Update traffic data" || echo "No changes to commit"
        git push
    
    - name: Send email with summary
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: TGA Audit Traffic Summary - ${{ env.DATE_STR }}
        to: prekas23@gmail.com
        from: GitHub Traffic Monitor <prekas23@gmail.com>
        body: file://traffic-repo/LATEST_SUMMARY.txt
    
    - name: Notify on failure
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 587
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: ⚠️ TGA Traffic Export FAILED - ${{ env.DATE_STR }}
        to: prekas23@gmail.com
