<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1070" viewBox="0 0 680 1070" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">Regulatory and accountability framework for COVID-19 vaccine safety monitoring in Australia</title>
<desc id="figDesc">National vaccination policy leads to the statutory provisional-registration framework under the Therapeutic Goods Act 1989. Two separate streams follow: sponsors and registration holders, who carry statutory obligations under sections 28, 29A and 29AA; and the TGA COVID-19 Vaccine Safety Monitoring Plan of February 2021, a policy and operational commitment rather than a statutory condition. The Department of Health and Aged Care holds PGPA Act obligations through its accountable authority. Commonwealth records obligations sit under the Archives Act. Recognised guidance including ICH E2E sits outside the statutory chain. Documentary verification tests whether implementation of the Plan can be independently verified.</desc>
