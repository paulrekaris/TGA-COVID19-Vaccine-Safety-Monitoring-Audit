<text x="40" y="25" font-size="14" font-weight="bold">Regulatory and accountability framework for COVID-19 vaccine safety monitoring in Australia</text>
<text x="40" y="46" font-size="11.5" class="tx-mute">Policy context, statutory obligations, institutional responsibilities and documentary verification</text>

<rect x="140" y="58" width="400" height="90" rx="3" class="bx" stroke-dasharray="4 3"/>
