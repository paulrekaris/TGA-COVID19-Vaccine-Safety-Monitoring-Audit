<text x="160" y="102" font-size="11">National Cabinet policy, November 2020</text>
<text x="160" y="122" font-size="11" class="tx-mute">Commitment to enhanced safety monitoring</text>
<text x="160" y="139" font-size="11" class="tx-mute">accompanying provisional approval</text>

<line x1="340" y1="148" x2="340" y2="166" class="ln"/>
<path d="M336 162 L340 168 L344 162" class="ln" fill="none"/>

<rect x="140" y="172" width="400" height="150" rx="3" class="bx"/>
<text x="160" y="196" font-size="12" font-weight="bold">Statutory framework: provisional registration</text>
<text x="160" y="215" font-size="11" class="tx-mute">Therapeutic Goods Act 1989</text>
<text x="160" y="238" font-size="11">ss 22C to 22F, provisional determination</text>
<text x="160" y="256" font-size="11">ss 23 and 23AA, application for provisional registration</text>
<text x="160" y="274" font-size="11">s 25, evaluation and registration decision</text>
<text x="160" y="292" font-size="11">s 28(2A)(aa), conditions of provisional registration</text>
<text x="160" y="310" font-size="11">s 29, registration period, extension and continuation</text>

<line x1="340" y1="322" x2="340" y2="342" class="ln"/>
<line x1="175" y1="342" x2="505" y2="342" class="ln"/>
<line x1="175" y1="342" x2="175" y2="354" class="ln"/>
<path d="M171 350 L175 356 L179 350" class="ln" fill="none"/>
<line x1="505" y1="342" x2="505" y2="354" class="ln"/>
<path d="M501 350 L505 356 L509 350" class="ln" fill="none"/>

<rect x="40" y="360" width="270" height="185" rx="3" class="bx"/>
<text x="58" y="384" font-size="12" font-weight="bold">Sponsors, registration holders</text>
<text x="58" y="408" font-size="11">Conditions of registration, s 28</text>
<text x="58" y="430" font-size="11">s 29A, notification of safety, efficacy</text>
<text x="58" y="448" font-size="11">and quality information; offence</text>
<text x="58" y="470" font-size="11">s 29AA, civil penalty for failure to</text>
<text x="58" y="488" font-size="11">notify</text>
<text x="58" y="512" font-size="11" class="tx-mute">Product-specific statutory obligations</text>
<text x="58" y="530" font-size="11" class="tx-mute">Distinct from TGA responsibilities</text>

<rect x="370" y="360" width="270" height="185" rx="3" class="bx" stroke-dasharray="4 3"/>
<text x="388" y="384" font-size="12" font-weight="bold">TGA Safety Monitoring Plan</text>
<text x="388" y="402" font-size="11" class="tx-mute">February 2021</text>
<text x="388" y="434" font-size="11">Operational framework for enhanced</text>
<text x="388" y="452" font-size="11">monitoring; a policy safeguard for the</text>
<text x="388" y="470" font-size="11">evidentiary uncertainty of provisional</text>
<text x="388" y="488" font-size="11">registration</text>
<text x="388" y="516" font-size="11" class="tx-mute">Five key objectives, 17 strategy items</text>

<line x1="505" y1="545" x2="505" y2="565" class="ln"/>

<rect x="370" y="565" width="270" height="95" rx="3" class="bx"/>
<text x="388" y="589" font-size="12" font-weight="bold">Department of Health and Aged Care</text>
<text x="388" y="609" font-size="11" class="tx-mute">Secretary as accountable authority</text>
<text x="388" y="631" font-size="11">PGPA Act ss 37 to 39</text>
<text x="388" y="649" font-size="11">Performance measurement and records</text>

<path d="M 505 660 L 505 673 L 185 673 L 185 685" class="ln" fill="none"/>
<path d="M181 681 L185 687 L189 681" class="ln" fill="none"/>

<rect x="40" y="691" width="290" height="95" rx="3" class="bx"/>
<text x="58" y="715" font-size="12" font-weight="bold">Commonwealth records</text>
<text x="58" y="739" font-size="11">Archives Act 1983, s 24</text>
<text x="58" y="759" font-size="11" class="tx-mute">Regulates disposal, destruction and</text>
<text x="58" y="776" font-size="11" class="tx-mute">alteration, not record creation</text>

<rect x="350" y="691" width="290" height="95" rx="3" class="bx" stroke-dasharray="2 3"/>
<text x="368" y="715" font-size="12" font-weight="bold">Recognised guidance</text>
<text x="368" y="733" font-size="11" class="tx-mute">Outside statutory chain</text>
<text x="368" y="757" font-size="11">ICH E2E, TGA adopted June 2005</text>
<text x="368" y="776" font-size="11" class="tx-mute">Not statutory in itself</text>

<path d="M 185 786 L 185 801 L 340 801 L 340 813" class="ln" fill="none"/>
<path d="M336 809 L340 815 L344 809" class="ln" fill="none"/>

<rect x="190" y="819" width="300" height="95" rx="3" class="bx-accent"/>
<text x="340" y="845" font-size="12" font-weight="bold" text-anchor="middle" class="tx-accent">Documentary verification</text>
<text x="340" y="867" font-size="11" text-anchor="middle" class="tx-accent">FOI searches, OAIC review, TGA records</text>
<text x="340" y="886" font-size="11" text-anchor="middle" class="tx-accent">19 outputs assessed</text>
<text x="340" y="905" font-size="11" text-anchor="middle" class="tx-accent">Can implementation be verified?</text>

<rect x="40" y="940" width="18" height="11" rx="2" class="bx"/>
<text x="66" y="949" font-size="11">Solid, statutory requirement on the named duty-holder</text>
<rect x="40" y="960" width="18" height="11" rx="2" class="bx" stroke-dasharray="4 3"/>
<text x="66" y="969" font-size="11">Dashed, policy or operational commitment</text>
<rect x="40" y="980" width="18" height="11" rx="2" class="bx" stroke-dasharray="2 3"/>
<text x="66" y="989" font-size="11">Dotted, recognised guidance, outside the statutory chain</text>

<text x="40" y="1012" font-size="10.5" class="tx-mute">Connecting lines indicate framework and contextual relationships. They do not denote statutory duty.</text>
